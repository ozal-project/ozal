name: Pages real OIDC acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-oidc-local-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Real GitHub OIDC token deploys through curl to a loopback Ozal
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: |
          mkdir -p "$GOTMPDIR"
          node scripts/pages-008-acceptance.mjs --github
