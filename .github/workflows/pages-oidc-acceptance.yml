name: Pages real OIDC acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-oidc-local-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - name: Real GitHub OIDC token deploys through curl to a loopback Ozal
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: |
          mkdir -p "$GOTMPDIR"
          node scripts/pages-008-acceptance.mjs --github
