name: release

# A v* tag builds the archives, checksums and SBOMs that .goreleaser.yaml
# defines and uploads them to a draft GitHub release (REL-006). The draft is
# published by hand after checking it against a local rebuild.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      # Creating the draft release and uploading its assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog and {{ .CommitTimestamp }} need the full history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The same gate as ci.yml: a tag on an unverified commit releases nothing.
      - name: Install optional linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # REL-014: the console's embedded build and the project page are
      # checked from a clean checkout, not only where node_modules exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/console/package-lock.json
            site/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          npm ci --prefix site --no-audit --no-fund
      - name: Gate
        env:
          OZAL_REQUIRE_FRONTEND: "1"
        run: scripts/verify.sh
      # Pinned and checked against the release's own checksums, the way
      # REL-005 was tested locally.
      - name: Install syft
        env:
          SYFT_VERSION: 1.14.0
        run: |
          dir="$RUNNER_TEMP/syft"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${archive}\$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" syft
          echo "$dir" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # The version .goreleaser.yaml was tested with.
          version: v2.3.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Edges that update on their own (`ozal update`) install only a release
      # whose checksums are signed by the key they pin. The key exists only as
      # this secret; without it the job fails instead of leaving an unsigned
      # release that every edge would refuse.
      - name: Sign checksums
        env:
          OZAL_RELEASE_KEY: ${{ secrets.OZAL_RELEASE_KEY }}
        run: |
          test -n "$OZAL_RELEASE_KEY" || { echo "OZAL_RELEASE_KEY secret is not set: run 'ozal release keygen' and add it" >&2; exit 1; }
          go run ./cmd/ozal release sign -key env:OZAL_RELEASE_KEY -in dist/checksums.txt -out dist/checksums.txt.sig
      - name: Upload signature to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/checksums.txt.sig --clobber
