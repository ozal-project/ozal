name: release

# A v* tag builds the archives, checksums and SBOMs that .goreleaser.yaml
# defines and uploads them to a draft GitHub release (REL-006). The draft is
# published by hand after checking it against a local rebuild.
#
# The release key never shares a job with the npm supply chain: `release`
# builds and checks the draft but has no key; `sign` checks out the tag with
# no npm, no module cache and read-only access, and receives only
# `checksums.txt`; `publish` has write access and no key. Configure the
# `release` environment with required reviewers: without their approval, no
# job that holds the key runs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      # Creating the draft release and uploading its assets.
      contents: write
    outputs:
      checksums: ${{ steps.checksums.outputs.contents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The changelog and {{ .CommitTimestamp }} need the full history.
          fetch-depth: 0
          # npm build tooling runs in this job; do not leave a write token in
          # .git/config. GoReleaser receives GITHUB_TOKEN in its own step.
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # The same gate as ci.yml: a tag on an unverified commit releases nothing.
      - name: Install optional linters
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # REL-014: the console's embedded build and the project page are
      # checked from a clean checkout, not only where node_modules exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/console/package-lock.json
            site/package-lock.json
      - name: Install frontend dependencies
        run: |
          npm ci --prefix web/console --no-audit --no-fund --ignore-scripts
          npm ci --prefix site --no-audit --no-fund --ignore-scripts
      - name: Gate
        env:
          OZAL_REQUIRE_FRONTEND: "1"
        run: scripts/verify.sh
      # Pinned and checked against the release's own checksums, the way
      # REL-005 was tested locally.
      - name: Install syft
        env:
          SYFT_VERSION: 1.14.0
        run: |
          dir="$RUNNER_TEMP/syft"
          mkdir -p "$dir" && cd "$dir"
          base="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}"
          archive="syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/syft_${SYFT_VERSION}_checksums.txt"
          grep " ${archive}\$" "syft_${SYFT_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archive" syft
          echo "$dir" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # The version .goreleaser.yaml was tested with.
          version: v2.3.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only this file crosses into the signing job. It is public data, not
      # an artifact the key holder needs to execute.
      - name: Export checksums for the signing job
        id: checksums
        run: |
          test -s dist/checksums.txt || { echo "goreleaser produced no checksums.txt" >&2; exit 1; }
          echo "contents=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  sign:
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Required reviewers on this environment are the human gate before the
    # release key is used.
    environment: release
    permissions:
      contents: read
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      # A clean checkout of the tagged commit: no npm, no module cache and no
      # credentials, so installing a frontend dependency cannot change the
      # code that runs beside the key.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Sign checksums
        id: sign
        env:
          GOFLAGS: -mod=readonly
          OZAL_RELEASE_KEY: ${{ secrets.OZAL_RELEASE_KEY }}
          CHECKSUMS: ${{ needs.release.outputs.checksums }}
        run: |
          test -n "$OZAL_RELEASE_KEY" || { echo "OZAL_RELEASE_KEY secret is not set: run 'ozal release keygen' and add it" >&2; exit 1; }
          test -n "$CHECKSUMS" || { echo "the release job produced no checksums" >&2; exit 1; }
          dir="$RUNNER_TEMP/dist"
          mkdir -p "$dir"
          printf '%s' "$CHECKSUMS" | base64 -d > "$dir/checksums.txt"
          test -s "$dir/checksums.txt" || { echo "checksums.txt is empty" >&2; exit 1; }
          go run ./cmd/ozal release sign -key env:OZAL_RELEASE_KEY -in "$dir/checksums.txt" -out "$dir/checksums.txt.sig"
          echo "signature=$(base64 -w0 "$dir/checksums.txt.sig")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [release, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Uploading the signature to the draft release.
      contents: write
    steps:
      - name: Upload signature to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          test -n "$SIGNATURE" || { echo "the sign job produced no signature" >&2; exit 1; }
          dir="$RUNNER_TEMP/dist"
          mkdir -p "$dir"
          printf '%s' "$SIGNATURE" | base64 -d > "$dir/checksums.txt.sig"
          test -s "$dir/checksums.txt.sig" || { echo "checksums.txt.sig is empty" >&2; exit 1; }
          gh release upload "$GITHUB_REF_NAME" "$dir/checksums.txt.sig" --clobber -R "$GITHUB_REPOSITORY"
