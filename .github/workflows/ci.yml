name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26.04 between 2026-10-19 and 2026-11-19;
        # pinned so one commit cannot pass on one image and fail on the other.
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Windows runners default to core.autocrlf=true, which rewrites every
      # file to CRLF and makes gofmt list the whole tree. Set before checkout.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Pinned: an unpinned linter changes the gate without any commit.
      - name: Install optional linters
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Gate
        run: scripts/verify.sh
