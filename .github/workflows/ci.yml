name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moves to Ubuntu 26.04 between 2026-10-19 and 2026-11-19;
        # pinned so one commit cannot pass on one image and fail on the other.
        # Windows is temporarily paused while compatibility work continues (REL-011).
        os: [ubuntu-24.04, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Pinned: an unpinned linter changes the gate without any commit.
      - name: Install optional linters
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      # REL-014: the console's embedded build and the project page are
      # checked from a clean checkout, not only where node_modules exists.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: startsWith(matrix.os, 'ubuntu')
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            web/console/package-lock.json
            site/package-lock.json
      - name: Install frontend dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          npm ci --prefix web/console --no-audit --no-fund
          npm ci --prefix site --no-audit --no-fund
      - name: Gate
        env:
          # Required on Linux; macOS runs the Go gate only.
          OZAL_REQUIRE_FRONTEND: ${{ startsWith(matrix.os, 'ubuntu') && '1' || '' }}
        run: scripts/verify.sh
