name: release-catalog

# Writes the signed update catalogs edges read at ozal.dev/api/v1/releases,
# which redirects to this repository's `catalogs` branch. They are re-signed
# weekly (they expire two weeks after signing) and when a release is published.
#
# The release key and write access never meet: `sign` holds the key, runs only
# Go from this checkout and gh (no npm, no module cache) and has read access;
# `publish` holds write access and no key, and can only push what `sign`
# produced. An edge refuses any catalog the key did not sign.
on:
  release:
    types: [published]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-catalog
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      archive: ${{ steps.sign.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build ozal
        run: go build -trimpath -o "$RUNNER_TEMP/ozal" ./cmd/ozal

      - name: Sign the update catalogs
        id: sign
        env:
          GH_TOKEN: ${{ github.token }}
          OZAL_RELEASE_KEY: ${{ secrets.OZAL_RELEASE_KEY }}
        run: |
          out="$RUNNER_TEMP/catalogs"
          OZAL="$RUNNER_TEMP/ozal" scripts/release/publish-catalogs.sh "$out"
          test -d "$out" || { echo "no channel has a published release; nothing to publish" >&2; exit 1; }
          # A few kilobytes: handed to the publish job as an output.
          echo "archive=$(tar -czf - -C "$out" . | base64 -w0)" >> "$GITHUB_OUTPUT"

  publish:
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Replace the catalogs branch
        env:
          CATALOGS: ${{ needs.sign.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$CATALOGS" || { echo "the sign job produced nothing" >&2; exit 1; }
          dir="$RUNNER_TEMP/catalogs"
          mkdir -p "$dir"
          printf '%s' "$CATALOGS" | base64 -d | tar -xzf - -C "$dir"
          cat > "$dir/README.md" <<'README'
          # Signed update catalogs

          Generated by the release-catalog workflow and replaced on every run;
          do not edit. Edges read them through https://ozal.dev/api/v1/releases.
          README
          cd "$dir"
          git init -q -b catalogs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Signed update catalogs"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:catalogs
          echo "Published: $(find . -path ./.git -prune -o -type f -print | sort | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
