name: site

# Builds the public project page and publishes it to ozal.octaviosantacruz.com
# through this edge's own deploy endpoint (PAGES-004/PAGES-008). The edge trusts
# only this file, in this repository, on main, run by a push or by hand, through
# a GitHub OIDC token: no deploy secret is stored here. Renaming this file or the
# branch stops deployments until the edge's project trust is updated
# (its project, kept in the edge's runtime file: CI projects in the console).
on:
  push:
    branches: [main]
    # The roadmap and changelog are read from the trackers at build time.
    # The live demo is the access decision compiled to WebAssembly, so a change
    # to the engine republishes the page.
    paths: [site/**, docs/TO_IMPLEMENT.md, docs/IMPLEMENTED.md, scripts/pages/**, cmd/ozalctl/**, internal/ctl/**, internal/pages/**, scripts/build-site-engine.sh, internal/auth/**, internal/config/**, internal/policycontext/**, internal/policydemo/**, cmd/policywasm/**, .github/workflows/site.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-production
  cancel-in-progress: false

env:
  DEPLOY_ENDPOINT: https://deploy.octaviosantacruz.com
  DEPLOY_PROJECT: switchboard-site
  SITE_URL: https://ozal.octaviosantacruz.com

jobs:
  deploy:
    # Enable only after the edge trusts this repository's owner/workflow.
    if: vars.OZAL_SITE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The demo's engine, from the same code the edge runs, and the matching
      # wasm_exec.js from this Go toolchain.
      - name: Build the live demo engine
        run: scripts/build-site-engine.sh

      - name: Test the engine as the page runs it
        run: node scripts/test-site-engine.mjs

      - name: Build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Build the native operator
        run: go build -trimpath -o "$RUNNER_TEMP/ozalctl" ./cmd/ozalctl

      - name: Refuse secrets in the build output
        run: '"$RUNNER_TEMP/ozalctl" site check -dir site/dist'

      - name: Pack
        run: '"$RUNNER_TEMP/ozalctl" site pack -dir site/dist -out "$RUNNER_TEMP/site.tar.gz"'

      # The last build that passed acceptance, to put back if this one fails.
      # Re-uploading it makes the same content-addressed deployment live again.
      - name: Restore the last good build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/last-good
          key: site-live-${{ github.sha }}
          restore-keys: site-live-

      - name: Deploy
        id: deploy
        run: '"$RUNNER_TEMP/ozalctl" site deploy -archive "$RUNNER_TEMP/site.tar.gz" -result "$RUNNER_TEMP/deployment.json" -apply'

      - name: Public acceptance
        run: '"$RUNNER_TEMP/ozalctl" site accept -url "$SITE_URL" -dir site/dist'

      - name: Remember this build as the last good one
        run: |
          mkdir -p "$RUNNER_TEMP/last-good"
          cp "$RUNNER_TEMP/site.tar.gz" "$RUNNER_TEMP/last-good/site.tar.gz"

      - name: Save the last good build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/last-good
          key: site-live-${{ github.sha }}

      - name: Roll back to the last good build
        if: failure() && steps.deploy.outputs.live == 'true'
        run: |
          if [ -f "$RUNNER_TEMP/last-good/site.tar.gz" ]; then
            "$RUNNER_TEMP/ozalctl" site deploy -archive "$RUNNER_TEMP/last-good/site.tar.gz" -result "$RUNNER_TEMP/rollback.json" -apply
            echo "Acceptance failed: rolled back to the last good build." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Acceptance failed and no previous build is cached: roll back on the edge with 'ozal site rollback -site switchboard-site'."
          fi
