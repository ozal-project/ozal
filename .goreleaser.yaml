# Release build (REL-005). Snapshot locally:
#   goreleaser release --snapshot --clean
# A tagged release (REL-006) publishes a draft GitHub release with the same
# artifacts. The admin console is embedded from internal/admin/console, which
# is committed and checked by scripts/verify.sh, so no Node step runs here.
version: 2

project_name: switchboard

before:
  hooks:
    - go mod verify

builds:
  - id: switchboard
    main: ./cmd/switchboard
    binary: switchboard
    env:
      # Pure Go throughout (SQLite is modernc): static binaries, no libc.
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    # Replaces GoReleaser's default, which stamps the build date
    # (-X main.date): that alone changes the build ID on every run.
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }} -X main.buildCommit={{ .Commit }}
    # The commit time instead of the build time: the same tag rebuilds to
    # the same bytes, so anyone can check a published checksum.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: switchboard
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - QUICKSTART.md
      - config.example.json
      - config.quickstart.json
      - scripts/release/install.sh
      - scripts/release/install-service.sh
      - docs/operations/download-install.md
      - docs/operations/first-application.md
      - docs/operations/administration.md
      - docs/security.md
      - docs/reference.md
      - docs/operations/switchboard.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

# One SPDX SBOM per archive, generated by syft from the archive contents.
sboms:
  - artifacts: archive

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"

release:
  github:
    owner: octaviosantacruz
    name: switchboard
  # Published by hand after reading the notes and checking the artifacts.
  draft: true
  prerelease: auto
