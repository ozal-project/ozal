<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Switchboard</title>
<link rel="stylesheet" href="/_/auth/passkey.css">
<script src="/_/auth/passkey.js" defer></script>
</head>
<body data-page="login">
<main>
  <h1>Sign in</h1>
  <p>Use the passkey on this device, your phone or a security key.</p>
  <label for="username">Account</label>
  <input id="username" name="username" autocomplete="username webauthn" placeholder="Choose a passkey">
  <button id="action" type="button">Sign in with a passkey</button>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
