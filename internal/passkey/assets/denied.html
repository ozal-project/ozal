<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<meta name="robots" content="noindex">
<link rel="icon" href="/_/auth/icons/switchboard.svg" type="image/svg+xml">
<title>No access · Switchboard</title>
<link rel="stylesheet" href="/_/auth/passkey.css">
</head>
<body data-page="denied">
<header>
  <span class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><circle class="dot-a" cx="6" cy="7" r="3.2"/><circle class="dot-b" cx="20" cy="19" r="3.2"/><path class="cord" d="M6 10.5 C6 19, 20 7, 20 15.5" stroke-width="2"/></svg>
    <span><span class="name">switchboard</span><span class="sub">secure sign-in</span></span>
  </span>
</header>
<main>
  <h1>You can't open <span class="host">{{.Host}}</span></h1>
  <p>You are signed in as <strong class="email">{{.Email}}</strong>. {{.Why}}</p>
  <a class="action" href="{{.Portal}}">See the apps you can open</a>
  <p class="hint">If you think this is a mistake, ask the person who runs it to give you access, and tell them the reference below.</p>
  <p class="reference">Reference: {{.Reference}}</p>
</main>
<footer>Self-hosted access</footer>
</body>
</html>
