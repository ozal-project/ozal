<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0e0d">
<link rel="icon" href="/_/auth/icons/ozal.svg" type="image/svg+xml">
<title>Your apps · Ozal</title>
<link rel="stylesheet" href="/_/auth/passkey.css">
<script src="/_/auth/passkey.js" defer></script>
</head>
<body data-page="me">
<header>
  <span class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path class="arch" d="M5 30V14.5A11 11 0 0 1 27 14.5V30H21.6V14.8A5.6 5.6 0 0 0 10.4 14.8V30Z"/><path class="leaf" d="M10.4 30V14.8A5.6 5.6 0 0 1 16 9.2V30Z"/><path class="light" d="M16 9.2A5.6 5.6 0 0 1 21.6 14.8V30H16Z"/></svg>
    <span><span class="name">ozal</span><span class="sub">secure sign-in</span></span>
  </span>
</header>
<main>
  <h1>Your apps</h1>
  <div class="who" id="who" hidden><span>Signed in as <strong id="email"></strong></span><button id="signout" class="link-button" type="button">Sign out</button></div>
  <p id="intro">Reading what you can open…</p>
  <nav id="apps" class="sites" aria-label="Apps you can open"></nav>
  <p class="hint" id="manage" hidden><a href="/_/auth/devices">Manage your passkeys</a></p>
  <section aria-labelledby="sessions-title"><h2 id="sessions-title">Your sessions</h2><p class="hint">Times reflect recorded use, not a live device location. Ending a session does not revoke its passkey.</p><ul id="sessions"></ul><button id="signout-all" type="button" class="link-button">Sign out everywhere</button></section>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<footer>Self-hosted access · only the apps you may open are listed</footer>
</body>
</html>
