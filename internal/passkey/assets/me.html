<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0e">
<title>Your apps · Switchboard</title>
<link rel="stylesheet" href="/_/auth/passkey.css">
<script src="/_/auth/passkey.js" defer></script>
</head>
<body data-page="me">
<header>
  <span class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true"><circle class="dot-a" cx="6" cy="7" r="3.2"/><circle class="dot-b" cx="20" cy="19" r="3.2"/><path class="cord" d="M6 10.5 C6 19, 20 7, 20 15.5" stroke-width="2"/></svg>
    <span><span class="name">switchboard</span><span class="sub">secure sign-in</span></span>
  </span>
</header>
<main>
  <h1>Your apps</h1>
  <div class="who" id="who" hidden><span>Signed in as <strong id="email"></strong></span><button id="signout" class="link-button" type="button">Sign out</button></div>
  <p id="intro">Reading what you can open…</p>
  <nav id="apps" class="sites" aria-label="Apps you can open"></nav>
  <p class="hint" id="manage" hidden><a href="/_/auth/devices">Manage your passkeys</a></p>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<footer>Self-hosted access · only the apps you may open are listed</footer>
</body>
</html>
