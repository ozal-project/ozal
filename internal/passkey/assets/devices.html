<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your passkeys · Switchboard</title>
<link rel="stylesheet" href="/_/auth/passkey.css">
<script src="/_/auth/passkey.js" defer></script>
</head>
<body data-page="devices">
<main>
  <h1>Your passkeys</h1>
  <p id="intro">Each passkey lets you sign in from one phone, computer or security key. Add one before you replace a device.</p>
  <ul id="devices" class="devices" aria-live="polite"></ul>
  <button id="action" type="button">Add a passkey</button>
  <p class="hint">Removing a passkey signs you out everywhere. Your only passkey cannot be removed here; if you lose every device, the operator can send you a new invitation.</p>
  <p id="status" role="status" aria-live="polite"></p>
</main>
</body>
</html>
